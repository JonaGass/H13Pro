defaults.pcm.rate_converter "speexrate_medium"
pcm.!default
{
    type asym
    playback.pcm "playback0"
    capture.pcm "dsnooper"
}

#### External PCM Names ####

pcm.playback0 {
    type plug
    slave {
        pcm {
            type softvol
            slave.pcm "plug:play_chn0"
            control {
            name "Playback0 Volume"
            card 0
        }
        min_dB -50.0
        max_dB 0.0
        resolution 256
    }
	channels 2
    format S16_LE
    rate 48000
    }
}

