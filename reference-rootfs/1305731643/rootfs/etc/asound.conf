#### Internal PCM Names ####

pcm.dmixer {
    type dmix
    ipc_key 5978293 # must be unique for all dmix plugins!!!!
    ipc_key_add_uid yes
    slave {
        pcm "hw:0,0"
        channels 2
    }
    bindings {
        0 0
        1 1
    }
}

pcm.hooks_ply  {
    type hooks
    slave {
        pcm dmixer
    }
    hooks.0 {
        type ctl_elems
        hook_args [{
            name "Playback Path"
            preserve true
            value "SPK_HP"
            lock false
        }]
    }
}

pcm.play_chn0 {
	type route
	slave {
		pcm "plug:hooks_ply"
		channels 2
	}
	ttable {
		0.0 1
		1.1 1
	}
}

pcm.play_chn1 {
	type route
	slave {
		pcm "plug:hooks_ply"
		channels 2
	}
	ttable {
		0.0 1
		1.1 1
	}
}

