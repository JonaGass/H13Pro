pcm.softvol_ply {
    type softvol
    slave {
        pcm dmixer
    }
    control {
        name "Master Playback Volume"
        card 0
        device 0
    }
    min_dB -30.0
    max_dB 0.0
    resolution 256
}

pcm.softvol_cap {
    type softvol
    slave.pcm "hw:1,0,0"
    control {
        name "MasterCap Volume"
        card 1
        device 0
    }
    min_dB -50.0
    max_dB 0.0
    resolution 256
}

pcm.dsnooper {
    type dsnoop
    ipc_key 5978291 # must be unique for all dmix plugins!!!!
    ipc_key_add_uid yes
    slave {
        pcm "hw:1,0"
        channels 2
        rate 16000
    }
    bindings {
        0 0
        1 1
    }
}

pcm.cap_chn0 {
    type route
    slave {
        pcm dsnooper
        channels 2
    }
    ttable {
        0.0 1.0
    }
}

pcm.cap_chn1 {
    type route
    slave {
        pcm dsnooper
        channels 2
    }
    ttable {
        1.1 1.0
    }
}
